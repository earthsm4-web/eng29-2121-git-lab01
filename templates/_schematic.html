<svg class="schematic" viewBox="0 0 560 420" role="img"
     aria-label="Common-emitter bias circuit with computed node voltages">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <marker id="bjt-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- พื้นหลังวงจร -->
  <rect x="130" y="30" width="300" height="350" rx="14" fill="url(#grad-bg)"
        stroke="currentColor" stroke-width="1" stroke-opacity="0.3"/>

  <g stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Supply rail (VCC) -->
    <line x1="150" y1="60" x2="260" y2="60"/>
    <line x1="260" y1="60" x2="380" y2="60"/>

    {% if mode == "divider" %}
    <!-- Divider Bias: R1 from VCC to Base node -->
    <line class="schematic-mode mode-divider" x1="260" y1="60" x2="260" y2="100"/>
    <rect class="schematic-mode mode-divider" x="250" y="100" width="20" height="44" rx="2"/>
    <line class="schematic-mode mode-divider" x1="260" y1="144" x2="220" y2="220"/>
    <!-- R2: Base node to Ground -->
    <line class="schematic-mode mode-divider" x1="220" y1="220" x2="220" y2="260"/>
    <rect class="schematic-mode mode-divider" x="210" y="260" width="20" height="44" rx="2"/>
    <line class="schematic-mode mode-divider" x1="220" y1="304" x2="220" y2="340"/>
    {% elif mode == "fixed" %}
    <!-- Fixed Bias: RB from Ground to Base -->
    <line class="schematic-mode mode-fixed" x1="160" y1="340" x2="160" y2="300"/>
    <rect class="schematic-mode mode-fixed" x="150" y="300" width="20" height="44" rx="2"/>
    <line class="schematic-mode mode-fixed" x1="160" y1="256" x2="220" y2="220"/>
    {% else %}
    <!-- Emitter Bias: RB from Ground to Base -->
    <line class="schematic-mode mode-emitter" x1="160" y1="340" x2="160" y2="300"/>
    <rect class="schematic-mode mode-emitter" x="150" y="300" width="20" height="44" rx="2"/>
    <line class="schematic-mode mode-emitter" x1="160" y1="256" x2="220" y2="220"/>
    {% endif %}

    <!-- RC: VCC to Collector -->
    <line x1="320" y1="60" x2="320" y2="100"/>
    <rect x="310" y="100" width="20" height="44" rx="2"/>
    <line x1="320" y1="144" x2="300" y2="200"/>

    {% if mode == "fixed" %}
    <!-- Emitter to ground direct (VE = 0 V) -->
    <line class="schematic-mode mode-fixed" x1="300" y1="240" x2="300" y2="340"/>
    {% else %}
    <!-- RE: Emitter to Ground -->
    <line class="schematic-mode mode-emitter schematic-mode mode-divider" x1="300" y1="240" x2="300" y2="280"/>
    <rect class="schematic-mode mode-emitter schematic-mode mode-divider" x="290" y="280" width="20" height="44" rx="2"/>
    <line class="schematic-mode mode-emitter schematic-mode mode-divider" x1="300" y1="324" x2="300" y2="340"/>
    {% endif %}

    <!-- Ground rail -->
    <line x1="160" y1="340" x2="300" y2="340"/>
    <line x1="230" y1="340" x2="230" y2="358"/>
    <line x1="218" y1="358" x2="242" y2="358"/>
    <line x1="224" y1="366" x2="236" y2="366"/>
    <line x1="228" y1="374" x2="232" y2="374"/>

    <!-- Transistor -->
    <g filter="url(#drop-shadow)">
      <circle cx="260" cy="220" r="32" fill="#ffffff" stroke="currentColor" stroke-width="2.5"/>
      <line x1="244" y1="194" x2="244" y2="246" stroke-width="5" stroke-linecap="round"/>
      <line x1="150" y1="220" x2="244" y2="220"/>
      <line x1="244" y1="204" x2="288" y2="180"/>
      <line x1="288" y1="180" x2="300" y2="200"/>
      <line x1="244" y1="236" x2="288" y2="260" marker-end="url(#bjt-arrow)"/>
      <line x1="288" y1="260" x2="300" y2="240"/>
    </g>
  </g>

  <g fill="currentColor" stroke="none" font-family="system-ui, -apple-system, sans-serif">
    <!-- VCC label -->
    <text id="s-vcc" x="140" y="52" font-size="13" font-weight="700">VCC {{ values.get("vcc", "") }} V</text>

    {% if mode == "divider" %}
    <text id="s-r1" class="schematic-mode mode-divider" x="240" y="128" text-anchor="end" font-size="12.5" font-weight="600">
      R1 {{ values.get("r1", "") }} kΩ
    </text>
    <text id="s-r2" class="schematic-mode mode-divider" x="200" y="288" text-anchor="end" font-size="12.5" font-weight="600">
      R2 {{ values.get("r2", "") }} kΩ
    </text>
    {% elif mode == "fixed" %}
    <text id="s-rb" class="schematic-mode mode-fixed" x="140" y="328" text-anchor="end" font-size="12.5" font-weight="600">
      RB {{ values.get("rb", "") }} kΩ
    </text>
    {% else %}
    <text id="s-rb" class="schematic-mode mode-emitter" x="140" y="328" text-anchor="end" font-size="12.5" font-weight="600">
      RB {{ values.get("rb", "") }} kΩ
    </text>
    <text id="s-re" class="schematic-mode mode-emitter schematic-mode mode-divider" x="280" y="308" text-anchor="end" font-size="12.5" font-weight="600">
      RE {{ values.get("re", "") }} kΩ
    </text>
    {% endif %}

    <text id="s-rc" x="340" y="128" font-size="12.5" font-weight="600">
      RC {{ values.get("rc", "") }} kΩ
    </text>

    {% if mode != "fixed" %}
    <text id="s-re-right" class="schematic-mode mode-emitter schematic-mode mode-divider" x="340" y="308" font-size="12.5" font-weight="600">
      RE {{ values.get("re", "") }} kΩ
    </text>
    {% endif %}

    <!-- Node voltages -->
    <text id="s-vb" x="210" y="216" font-size="12" font-weight="700" fill="#0f766e">
      VB {{ result.vb|v if result is defined and result else "-- V" }}
    </text>
    <text id="s-vc" x="310" y="196" font-size="12" font-weight="700" fill="#0f766e">
      VC {{ result.vc|v if result is defined and result else "-- V" }}
    </text>
    <text id="s-ve" x="310" y="256" font-size="12" font-weight="700" fill="#0f766e">
      VE {{ result.ve|v if result is defined and result else "-- V" }}
    </text>

    <!-- Pin labels -->
    <text x="224" y="218" font-size="11" font-weight="700" opacity="0.7">B</text>
    <text x="290" y="198" font-size="11" font-weight="700" opacity="0.7">C</text>
    <text x="290" y="258" font-size="11" font-weight="700" opacity="0.7">E</text>

    <!-- Transistor info -->
    <text x="330" y="200" font-size="13" font-weight="700">Q1</text>
    <text x="330" y="217" font-size="11" opacity="0.7">NPN</text>
    <text id="s-beta" x="330" y="232" font-size="11" opacity="0.7">
      (β = {{ values.get("beta", "") }})
    </text>

    <!-- Computed Q-point -->
    <text id="s-vce" x="350" y="342" font-size="11.5" font-weight="700" fill="#0f766e">
      VCE {{ result.vce|v if result is defined and result else "-- V" }}
    </text>
    <text id="s-ic" x="350" y="358" font-size="11.5" font-weight="700" fill="#0f766e">
      IC {{ result.ic|i if result is defined and result else "-- A" }}
    </text>
  </g>
</svg>
