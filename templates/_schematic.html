<svg class="schematic" viewBox="0 0 560 400" role="img"
     aria-label="Common-emitter bias circuit with computed node voltages">
  <defs>
    <marker id="bjt-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round">
    <!-- supply rail -->
    <line x1="200" y1="60" x2="300" y2="60"/>
    <!-- R1 -->
    <line x1="200" y1="60" x2="200" y2="110"/>
    <rect x="190" y="110" width="20" height="44"/>
    <line x1="200" y1="154" x2="200" y2="200"/>
    <!-- R2 -->
    <line x1="200" y1="200" x2="200" y2="272"/>
    <rect x="190" y="272" width="20" height="44"/>
    <line x1="200" y1="316" x2="200" y2="350"/>
    <!-- RC -->
    <line x1="300" y1="60" x2="300" y2="86"/>
    <rect x="290" y="86" width="20" height="44"/>
    <line x1="300" y1="130" x2="300" y2="150"/>
    <!-- RE -->
    <line x1="300" y1="250" x2="300" y2="278"/>
    <rect x="290" y="278" width="20" height="44"/>
    <line x1="300" y1="322" x2="300" y2="350"/>
    <!-- ground rail -->
    <line x1="200" y1="350" x2="300" y2="350"/>
    <line x1="250" y1="350" x2="250" y2="366"/>
    <line x1="228" y1="366" x2="272" y2="366"/>
    <line x1="238" y1="374" x2="262" y2="374"/>
    <line x1="247" y1="382" x2="253" y2="382"/>

    <!-- transistor -->
    <circle cx="270" cy="200" r="34"/>
    <line x1="252" y1="176" x2="252" y2="224" stroke-width="4"/>
    <line x1="200" y1="200" x2="252" y2="200"/>
    <line x1="252" y1="186" x2="288" y2="164"/>
    <line x1="288" y1="164" x2="300" y2="150"/>
    <line x1="252" y1="214" x2="288" y2="236" marker-end="url(#bjt-arrow)"/>
    <line x1="288" y1="236" x2="300" y2="250"/>
  </g>

  <g fill="currentColor" stroke="none" font-size="13">
    <text x="250" y="46" text-anchor="middle" font-weight="600">
      VCC {{ params.vcc|num }} V
    </text>
    <text x="184" y="138" text-anchor="end">R1 {{ params.r1|r }}</text>
    <text x="184" y="300" text-anchor="end">R2 {{ params.r2|r }}</text>
    <text x="316" y="114">RC {{ params.rc|r }}</text>
    <text x="316" y="306">RE {{ params.re|r }}</text>

    <text x="196" y="192" text-anchor="end" class="node">
      VB {{ result.vb|v }}
    </text>
    <text x="316" y="146">VC {{ result.vc|v }}</text>
    <text x="316" y="258">VE {{ result.ve|v }}</text>

    <text x="238" y="196" font-size="11" class="pin">B</text>
    <text x="282" y="160" font-size="11" class="pin">C</text>
    <text x="282" y="250" font-size="11" class="pin">E</text>

    <text x="310" y="194" font-size="12" font-weight="600">Q1</text>
    <text x="310" y="211" font-size="11">NPN</text>
    <text x="310" y="226" font-size="11">(β = {{ params.beta|num }})</text>
  </g>

  <g>
    <rect x="382" y="176" width="166" height="64" rx="8"
          fill="#eef2f6" stroke="currentColor" stroke-width="1.5"/>
    <text x="394" y="200" fill="currentColor" font-size="12" font-weight="600">
      IC {{ result.ic|i }}
    </text>
    <text x="394" y="222" fill="currentColor" font-size="12" font-weight="600">
      VCE {{ result.vce|v }}
    </text>
  </g>
</svg>
