<h2>How this was calculated</h2>
<table class="steps">
  <thead>
    <tr>
      <th>Quantity</th>
      <th>Formula</th>
      <th>Substitution</th>
      <th>Result</th>
    </tr>
  </thead>
  <tbody>
    {% for step in steps %}
    <tr>
      <td class="step-quantity">{{ step.quantity }}</td>
      <td class="step-formula">{{ step.formula }}</td>
      <td class="step-substitution">{{ step.substitution }}</td>
      <td class="step-result">{{ step.result }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
