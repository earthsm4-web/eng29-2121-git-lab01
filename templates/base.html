<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 02: BJT DC Bias Web App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="14" y="14" width="20" height="20" rx="3" fill="none"
                stroke="currentColor" stroke-width="2.4"/>
          <rect x="20" y="20" width="8" height="8" rx="1.4" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <line x1="14" y1="19" x2="8" y2="19"/>
            <line x1="14" y1="24" x2="8" y2="24"/>
            <line x1="14" y1="29" x2="8" y2="29"/>
            <line x1="34" y1="19" x2="40" y2="19"/>
            <line x1="34" y1="24" x2="40" y2="24"/>
            <line x1="34" y1="29" x2="40" y2="29"/>
            <line x1="19" y1="14" x2="19" y2="8"/>
            <line x1="24" y1="14" x2="24" y2="8"/>
            <line x1="29" y1="14" x2="29" y2="8"/>
            <line x1="19" y1="34" x2="19" y2="40"/>
            <line x1="24" y1="34" x2="24" y2="40"/>
            <line x1="29" y1="34" x2="29" y2="40"/>
          </g>
        </svg>
        <div>
          <h1>Lab 02: BJT DC Bias Web App</h1>
          <p class="subtitle">ENG29 2121 &ndash; Common Emitter (Voltage Divider Bias)</p>
        </div>
      </div>
      <span class="course-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6 3 12l6 6M15 6l6 6-6 6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Computer Programming for<br>Electrical Engineers</span>
      </span>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
